[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vibeflow"
dynamic = ["version"]
description = "System-wide AI dictation for Windows (local whisper.cpp + LLM cleanup)"
requires-python = ">=3.11"
dependencies = [
    "pynput",
    "sounddevice",
    "numpy",
    "pystray",
    "Pillow",
    "pywin32",
    "requests",
    "tomli-w",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
vibeflow = "vibeflow.app:main"

[tool.setuptools]
packages = ["vibeflow"]

[tool.setuptools.dynamic]
version = { attr = "vibeflow.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
